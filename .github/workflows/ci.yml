name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Install globally from GitHub and smoke-test project lifecycle
        shell: bash
        run: |
          npm install --global git+https://github.com/shibushaba/Senpaii.git#feat/cdk-global-cli-v0.1.0
          cdk-kit --version
          node -e "require('node:fs').mkdirSync('cdk-smoke-project', { recursive: true })"
          cdk-kit init cdk-smoke-project --yes
          cdk-kit status cdk-smoke-project
          cdk-kit uninstall cdk-smoke-project --yes
