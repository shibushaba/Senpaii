name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Committed dist matches the TypeScript sources
        run: git diff --exit-code -- dist
      - name: Install this commit globally and smoke-test project lifecycle
        run: |
          npm install --global .
          node scripts/smoke-global-install.mjs
